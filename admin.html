<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLEEP 2026 後台</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:28px}
.wrap{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #e6ebf3;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 28px rgba(15,23,42,.06)}
h1{margin:0 0 10px}.sub{color:#647084;line-height:1.7}.btn{border:0;border-radius:999px;background:#2563eb;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn.gray{background:#e2e8f0;color:#334155}
code{background:#f1f5f9;padding:2px 6px;border-radius:8px}
</style></head>
<body><div class="wrap">
<div class="card">
<h1>Sleep2026 圖片讀取說明</h1>
<div class="sub">
這版支援雙模式：<br><br>
<strong>本機測試：</strong>用 <code>python3 -m http.server 8000</code> 開啟 <code>http://localhost:8000</code>，前台會讀同層 <code>images/</code> 資料夾。<br>
<strong>GitHub Pages：</strong>上傳後，前台會改用 GitHub API 讀取 repo 的 <code>images/</code>。<br><br>
圖片檔名只要包含品牌名即可，例如品牌是 <code>Philips Diagnostics</code>，圖片可命名為 <code>philips diagnostics.jpg</code>。
</div>
<p>
<button class="btn" onclick="localStorage.clear();alert('已清除瀏覽器暫存')">清除暫存</button>
<a class="btn gray" href="index.html" style="text-decoration:none">回前台</a>
</p>
</div>
</div></body></html>
